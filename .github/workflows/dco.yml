name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DCO sign-off on all commits
        uses: actions/github-script@v8
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const signoffRe = /^Signed-off-by: .+ <(.+)>$/gim;
            const failures = [];

            for (const c of commits) {
              // Merge commits are exempt; they are not authored patches.
              if (c.parents && c.parents.length > 1) continue;

              const message = c.commit.message;
              const authorEmail = (c.commit.author?.email || '').toLowerCase();
              const committerEmail = (c.commit.committer?.email || '').toLowerCase();
              const signoffs = [...message.matchAll(signoffRe)].map((m) => m[1].toLowerCase());

              if (!signoffs.includes(authorEmail) && !signoffs.includes(committerEmail)) {
                failures.push(`${c.sha.substring(0, 7)}: ${message.split('\n')[0]}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                [
                  'The following commits are missing a valid DCO sign-off:',
                  ...failures,
                  '',
                  'Add one with: git commit -s   (amend the last: git commit --amend -s --no-edit)',
                  'Backfill a branch: git rebase --signoff main',
                  'See CONTRIBUTING.md for details.',
                ].join('\n'),
              );
            } else {
              core.info(`All ${commits.length} commit(s) carry a valid DCO sign-off.`);
            }
