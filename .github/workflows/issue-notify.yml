name: Issue Notify

on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment and tag maintainer
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            const { issue } = context.payload;
            const opener = issue.user.login;
            const issueUrl = issue.html_url;
            const bodyPreview = issue.body?.split('\n')[0]?.substring(0, 100) || 'No description';

            const body = [
              `@amaanx86 A new issue requires your attention.`,
              '',
              `| Field | Details |`,
              `| --- | --- |`,
              `| **Author** | @${opener} |`,
              `| **Issue** | [#${issue.number} - ${issue.title}](${issueUrl}) |`,
              `| **Preview** | ${bodyPreview}${issue.body?.split('\n')[0]?.length > 100 ? '...' : ''} |`,
              '',
              'Please review and triage at your earliest convenience.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            // Add eyes reaction to the issue
            await github.rest.reactions.createForIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              content: 'eyes',
            });
